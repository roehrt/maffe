name: Linux Python wheels

on:
  pull_request:
  push:
    branches: [main, unrooted]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the tested wheels to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: [cp311, cp312, cp313, cp314]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag matches the package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: python -m pip install cibuildwheel==3.4.1
      - name: Build and test wheel
        run: python -m cibuildwheel --only ${{ matrix.python }}-manylinux_x86_64 --output-dir dist-wheels
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64-${{ matrix.python }}
          path: dist-wheels/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: wheels
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish_testpypi ||
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/maffe/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-linux-x86_64-*
          path: dist
          merge-multiple: true
      - name: Publish tested wheels to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi:
    name: Verify TestPyPI artifact hashes
    needs: publish-testpypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-linux-x86_64-*
          path: dist
          merge-multiple: true
      - run: python scripts/verify_published_wheels.py testpypi dist

  test-testpypi:
    name: Install from TestPyPI
    needs: publish-testpypi
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the released version from TestPyPI
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for attempt in {1..6}; do
            if python -m pip install --no-cache-dir --no-deps --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ "maffe==$version"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Test the installed package
        run: python tests/test_python.py

  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, verify-testpypi, test-testpypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/maffe/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-linux-x86_64-*
          path: dist
          merge-multiple: true
      - name: Publish the verified wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/

  verify-pypi:
    name: Verify PyPI artifact hashes
    needs: publish-pypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-linux-x86_64-*
          path: dist
          merge-multiple: true
      - run: python scripts/verify_published_wheels.py pypi dist

  test-pypi:
    name: Install from PyPI
    needs: publish-pypi
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the released version from PyPI
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for attempt in {1..6}; do
            if python -m pip install --no-cache-dir --no-deps --only-binary=:all: \
              --index-url https://pypi.org/simple/ "maffe==$version"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Test the installed package
        run: python tests/test_python.py
