[build-system]
requires = [
  "meson>=1.3.0",
  "meson-python>=0.18",
  "ninja",
  "cmake>=3.20",
  "pybind11>=3.0",
]
build-backend = "mesonpy"

[project]
name = "maffe"
version = "0.1.1"
description = "Python bindings for the maffe solver"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND Apache-2.0 AND BSD-3-Clause AND Zlib"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]

[project.urls]
Repository = "https://github.com/roehrt/maffe"
Issues = "https://github.com/roehrt/maffe/issues"

[tool.meson-python.args]
setup = ["-Dpython=true", "-Dcli=false", "-Dgurobi=disabled"]

[tool.cibuildwheel]
build = "cp311-manylinux_x86_64 cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64"
test-command = "python {project}/tests/test_python.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }
config-settings = { compile-args = "-j4" }

[tool.cibuildwheel.windows]
before-build = "python -m pip install delvewheel==1.12.0"
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel}"
test-command = "python {project}/scripts/test_windows_wheel.py {project}/tests/test_python.py"
